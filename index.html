<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Sous Chef</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div id="screen-input" class="screen active">
        <h2>Введите список продуктов</h2>
        <input type="text" id="userProducts" placeholder="Например: помидоры, огурцы, яйца">
        <button class="btn" onclick="sendToServer()">Получить рецепты</button>
    </div>

    <div id="screen-loading" class="screen">
        <h2>Готовка...</h2>
    </div>

    <div id="screen-result" class="screen">
        <h2>Рецепты</h2>
        <div class="result-box" id="resultText">Здесь будут рецепты</div>
        <button class="btn btn-secondary" onclick="showScreen('screen-input')">Назад</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
